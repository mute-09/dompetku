<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Masuk · DompetKu</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0d14">
  <script>
    // Terapkan tema sebelum paint pertama (anti-kedip) — sejajar resolveTheme() di ui.js.
    try {
      var t = (JSON.parse(localStorage.getItem('dompetku.v2') || '{}').settings || {}).theme;
      var sistem = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : sistem;
      document.querySelector('meta[name="theme-color"]').content =
        document.documentElement.dataset.theme === 'light' ? '#f6f7fb' : '#0b0d14';
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=1.11">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=1.11">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth">
  <main class="auth__card">
    <div class="auth__brand">
      <span class="auth__logo" aria-hidden="true">💰</span>
      <h1 class="auth__title">DompetKu</h1>
      <p class="auth__subtitle">Masuk untuk membuka dompet keluarga.</p>
    </div>

    <form id="loginForm" class="auth__form" novalidate>
      <div class="field">
        <label class="field__label" for="username">Nama pengguna</label>
        <input class="field__control" id="username" name="username" type="text" autocomplete="username"
               autocapitalize="none" spellcheck="false" required maxlength="24" placeholder="buya">
      </div>
      <div class="field">
        <label class="field__label" for="password">Password</label>
        <div class="auth__password">
          <input class="field__control" id="password" name="password" type="password" autocomplete="current-password"
                 required maxlength="128" placeholder="••••••••">
          <button class="auth__reveal" id="togglePassword" type="button" aria-label="Tampilkan password">Lihat</button>
        </div>
      </div>

      <p class="auth__error" id="loginError" role="alert" hidden></p>
      <p class="auth__slots" id="loginSlots" hidden></p>

      <button class="btn btn--primary btn--block" id="loginButton" type="submit">Masuk</button>
    </form>

    <p class="auth__hint">Maksimal 2 perangkat bisa masuk bersamaan. Sesi otomatis berakhir setelah 30 hari tidak aktif.</p>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
