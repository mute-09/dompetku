<!DOCTYPE html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d14">
    <script>
      // Terapkan tema sebelum paint pertama (anti-kedip) — sejajar resolveTheme() di ui.js.
      try {
        var t = (JSON.parse(localStorage.getItem('dompetku.v2') || '{}').settings || {}).theme;
        var sistem = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : sistem;
        document.querySelector('meta[name="theme-color"]').content =
          document.documentElement.dataset.theme === 'light' ? '#f6f7fb' : '#0b0d14';
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DompetKu">
    <title>DompetKu — Kalender</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=1.23">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=1.23">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/laporan.css">
    <link rel="stylesheet" href="css/kalender.css">
  </head>
  <body>
    <div class="shell shell--wide">
      <header class="appbar" id="appbar">
        <div class="appbar__brand">
          <span class="appbar__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </span>
          <div>
            <h1 class="appbar__title">Kalender</h1>
            <p class="appbar__sub" id="appbarSub">Agenda keluarga</p>
          </div>
        </div>
        <div class="appbar__actions">
          <span class="sync" id="syncBadge" data-tone="idle" hidden></span>
          <button class="icon-btn" id="themeToggle" type="button" aria-label="Ganti tema"></button>
          <button class="icon-btn" id="settingsBtn" type="button" aria-label="Pengaturan">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 14.5a1.6 1.6 0 0 0 .32 1.76l.06.06a2 2 0 1 1-2.83 2.83l-.05-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1.05-1.46 1.6 1.6 0 0 0-1.76.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .32-1.76 1.6 1.6 0 0 0-1.47-.98H4a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.46-1.04 1.6 1.6 0 0 0-.32-1.77l-.06-.05a2 2 0 1 1 2.83-2.83l.06.06a1.6 1.6 0 0 0 1.76.32H10a1.6 1.6 0 0 0 .98-1.47V4a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 .98 1.47 1.6 1.6 0 0 0 1.75-.33l.06-.05a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.32 1.76V10c.11.61.62 1.05 1.24 1.06H20a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5.94z"/>
            </svg>
          </button>
          <button class="icon-btn icon-btn--account" id="accountBtn" type="button" aria-label="Akun">?</button>
        </div>
      </header>

      <main class="page">
        <section class="card" aria-label="Filter agenda">
          <div class="card__head">
            <h2 class="card__title">Tampilkan agenda</h2>
            <span class="card__hint">Saring per kategori</span>
          </div>
          <div class="chips chips--scroll" id="calendarFilterChips" role="group" aria-label="Saring kategori agenda"></div>
        </section>

        <section class="card" aria-label="Daftar agenda">
          <div class="card__head">
            <div>
              <h2 class="card__title">Agenda</h2>
              <p class="card__hint">Mendatang dulu, dikelompokkan per tanggal</p>
            </div>
            <button class="btn btn--primary cal__add" id="addCalendarBtn" type="button">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Tambah
            </button>
          </div>
          <div id="calendarList"></div>
          <p class="empty cal__empty" id="calendarEmpty" hidden>Belum ada agenda. Ketuk Tambah untuk membuat agenda dengan kategori apa saja.</p>
        </section>
      </main>
    </div>

    <nav class="nav" aria-label="Navigasi utama">
      <a class="nav__item" href="index.html">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.6 12 3.4l9 7.2"/><path d="M5.4 9.6V19a1.4 1.4 0 0 0 1.4 1.4h10.4A1.4 1.4 0 0 0 18.6 19V9.6"/><path d="M9.8 20.4v-5.2h4.4v5.2"/>
        </svg>
        Catat
      </a>
      <a class="nav__item" href="laporan.html">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 17v-5"/><path d="M13 17V7"/><path d="M18 17v-8"/>
        </svg>
        Laporan
      </a>
      <a class="nav__item is-active" href="kalender.html" aria-current="page">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        Kalender
      </a>
    </nav>


    <script type="module" src="js/calendar.js?v=1.23"></script>
  </body>
</html>
