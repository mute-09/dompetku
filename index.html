<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <script>
    // Terapkan tema sebelum paint pertama (anti-kedip) — sejajar resolveTheme() di ui.js.
    try {
      var t = (JSON.parse(localStorage.getItem('dompetku.v2') || '{}').settings || {}).theme;
      var sistem = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : sistem;
      document.querySelector('meta[name="theme-color"]').content =
        document.documentElement.dataset.theme === 'light' ? '#f6f7fb' : '#0b0d14';
    } catch (e) {}
  </script>
  <meta name="description" content="DompetKu — catat pemasukan, pengeluaran, dan saldo keluargamu dengan cepat.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DompetKu">
  <title>DompetKu — Catat</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/catat.css">
  <link rel="stylesheet" href="css/receipt.css">
  <script type="module" src="js/catat.js"></script>
</head>
<body>
  <div class="shell">
    <header class="appbar" id="appbar">
      <div class="appbar__brand">
        <span class="appbar__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 7V5.5A1.5 1.5 0 0 0 17.5 4h-12A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20h12a1.5 1.5 0 0 0 1.5-1.5V16"/>
            <path d="M20.5 9.5h-4a2.5 2.5 0 0 0 0 5h4z"/>
          </svg>
        </span>
        <div>
          <h1 class="appbar__title">DompetKu</h1>
          <p class="appbar__sub" id="appbarSub">Catat cepat, rapi tiap hari</p>
        </div>
      </div>
      <div class="appbar__actions">
        <span class="sync" id="syncBadge" data-tone="idle" hidden></span>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Ganti tema"></button>
        <button class="icon-btn" id="settingsBtn" type="button" aria-label="Pengaturan">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 14.5a1.6 1.6 0 0 0 .32 1.76l.06.06a2 2 0 1 1-2.83 2.83l-.05-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1.05-1.46 1.6 1.6 0 0 0-1.76.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .32-1.76 1.6 1.6 0 0 0-1.47-.98H4a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.46-1.04 1.6 1.6 0 0 0-.32-1.77l-.06-.05a2 2 0 1 1 2.83-2.83l.06.06a1.6 1.6 0 0 0 1.76.32H10a1.6 1.6 0 0 0 .98-1.47V4a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 .98 1.47 1.6 1.6 0 0 0 1.75-.33l.06-.05a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.32 1.76V10c.11.61.62 1.05 1.24 1.06H20a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5.94z"/>
          </svg>
        </button>
        <button class="icon-btn icon-btn--account" id="accountBtn" type="button" aria-label="Akun">?</button>
      </div>
    </header>

    <main class="page">
      <section class="balance" aria-labelledby="balanceLabel">
        <div class="balance__glow" aria-hidden="true"></div>
        <div class="balance__top">
          <p class="balance__label" id="balanceLabel">Saldo Tersisa</p>
          <span class="balance__date" id="balanceDate"></span>
        </div>
        <p class="balance__amount num" id="balanceAmount">Rp 0</p>
        <div class="balance__flows">
          <div class="flow flow--in">
            <span class="flow__label">Pemasukan</span>
            <span class="flow__value num" id="totalIncome">Rp 0</span>
          </div>
          <span class="flow__divider" aria-hidden="true"></span>
          <div class="flow flow--out">
            <span class="flow__label">Pengeluaran</span>
            <span class="flow__value num" id="totalExpense">Rp 0</span>
          </div>
        </div>
        <div class="balance__stats" id="balanceStats"></div>
      </section>

      <section class="actions" aria-label="Catat transaksi baru">
        <button class="action action--expense" id="catatExpense" type="button">
          <span class="action__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/>
            </svg>
          </span>
          <span class="action__text">
            <span class="action__label">Catat Pengeluaran</span>
            <span class="action__hint">Uang keluar</span>
          </span>
        </button>
        <button class="action action--income" id="catatIncome" type="button">
          <span class="action__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5v14"/>
            </svg>
          </span>
          <span class="action__text">
            <span class="action__label">Catat Pemasukan</span>
            <span class="action__hint">Uang masuk</span>
          </span>
        </button>
      </section>
    </main>

    <nav class="nav" aria-label="Navigasi utama">
      <a class="nav__item is-active" href="index.html" aria-current="page">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.6 12 3.4l9 7.2"/><path d="M5.4 9.6V19a1.4 1.4 0 0 0 1.4 1.4h10.4A1.4 1.4 0 0 0 18.6 19V9.6"/><path d="M9.8 20.4v-5.2h4.4v5.2"/>
        </svg>
        Catat
      </a>
      <a class="nav__item" href="laporan.html">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 17v-5"/><path d="M13 17V7"/><path d="M18 17v-8"/>
        </svg>
        Laporan
      </a>
    </nav>
  </div>
</body>
</html>
